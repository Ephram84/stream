name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.26.3
        cache: true

    - name: Install dependencies
      run: make deps

    - name: Build
      run: make build

    - name: Fix code
      run: make fix

    - name: Check for vulnerabilities
      run: make vulncheck

    - name: Test
      run: make test-short